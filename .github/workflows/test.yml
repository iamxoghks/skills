name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  skills:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          check-latest: true

      - name: Verify Node.js security baseline
        run: |
          node -e "const [major, minor, patch] = process.versions.node.split('.').map(Number); if (major !== 24 || minor < 22 || (minor === 22 && patch < 1)) throw new Error('Node.js 24.22.1+ in the 24.x line is required'); console.log(process.version)"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg poppler-utils

      - name: Install Playwright and Python verification tools
        run: |
          npm install --global @playwright/cli playwright
          npx playwright install --with-deps chromium
          python -m pip install --upgrade pip pillow pypdf

      - name: Verify skill discovery
        run: npx --yes skills add . --list

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Run end-to-end smoke test
        run: python tests/smoke_test.py

  codex-receipts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        # Keep the minimum supported runtime as a compatibility check.
        # The patched 22.x runtime is verified separately.
        node: ["22.12.0", "22.23.4", "24", "26"]
    defaults:
      run:
        working-directory: packages/codex-receipts

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          check-latest: true
          cache: npm
          cache-dependency-path: packages/codex-receipts/package-lock.json

      - name: Verify supported Node.js security baseline
        if: matrix.node != '22.12.0'
        run: |
          node -e "const [major, minor, patch] = process.versions.node.split('.').map(Number); const floors = { 22: [23, 4], 24: [22, 1], 26: [12, 1] }; const floor = floors[major]; if (!floor || minor < floor[0] || (minor === floor[0] && patch < floor[1])) throw new Error('Node.js security release from 2026-10-21 or newer is required'); console.log(process.version)"

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev

      - name: Audit development dependencies
        run: npm audit

      - name: Test package
        run: npm test

      - name: Verify package contents
        run: npm pack --dry-run
